  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const DURATION = 6.784;

      // ---- Scene 1 (0.0–2.3s): plate at rest, kicker, the two aisle outlines draw
      tl.fromTo(
        $("05-hold-kicker"),
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        0.15,
      );
      // svg-path-draw: dash = whole path (pathLength 1), offset 1 → 0
      const ZONE_DRAW = 0.7;
      tl.fromTo(
        $("05-hold-zone-a"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: ZONE_DRAW, ease: "power2.out" },
        0.5,
      );
      tl.fromTo(
        $("05-hold-zone-b"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: ZONE_DRAW, ease: "power2.out" },
        0.5 + ZONE_DRAW * 0.75,
      );

      // ---- Scene 2 (2.3–4.2s): headline per word; each word's slot is computed
      // from its length (dynamic-content-sequencing), pre-computed once at build.
      const HEAD_START = 2.3;
      const BASE = 0.12;
      const SEC_PER_CHAR = 0.03;
      const words = Array.prototype.slice.call(
        $("05-hold-headline").querySelectorAll("span > span"),
      );
      let cumulative = 0;
      const WORD_TIMELINE = words.map(function (el) {
        const start = cumulative;
        cumulative += BASE + el.textContent.trim().length * SEC_PER_CHAR;
        return { el: el, start: start };
      });
      WORD_TIMELINE.forEach(function (entry) {
        tl.fromTo(
          entry.el,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          HEAD_START + entry.start,
        );
      });

      // ---- Scene 3 (4.2–6.8s): callout + leader to the vehicle, then the status line
      tl.fromTo(
        $("05-hold-callout"),
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
        4.2,
      );
      tl.fromTo(
        $("05-hold-leader"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" },
        4.4,
      );
      tl.fromTo(
        $("05-hold-target"),
        { strokeDashoffset: 1 },
        { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" },
        4.4 + 0.55 * 0.75,
      );
      tl.fromTo(
        $("05-hold-status"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        5.4,
      );

      // hold completely still to the end of the frame (no exit)
      tl.to({}, { duration: 0.001 }, DURATION - 0.001);

      window.__timelines["05-hold"] = tl;
    })();
  </script>
