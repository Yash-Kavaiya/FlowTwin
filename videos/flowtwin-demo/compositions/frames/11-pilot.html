    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        var scope =
          document.querySelector('[data-composition-id="11-pilot"]') || document;
        var all = function (sel) {
          return Array.prototype.slice.call(scope.querySelectorAll(sel));
        };

        /* ---------- Scene 1 (0.0-2.4s): kicker + per-word headline ---------- */
        tl.fromTo(
          ".f11-pilot-stub",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power2.out" },
          0.05,
        );
        tl.fromTo(
          ".f11-pilot-kicker",
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
          0.1,
        );

        // dynamic-content-sequencing: each word's start is computed once from
        // the length of the words before it, not hand-placed.
        var WORD_AT = 0.3;
        var WORD_BASE = 0.22;
        var SEC_PER_CHAR = 0.032;
        var cumulative = WORD_AT;
        all(".f11-pilot-word").forEach(function (el) {
          var start = cumulative;
          cumulative += WORD_BASE + el.textContent.length * SEC_PER_CHAR;
          tl.fromTo(
            el,
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            start,
          );
        });

        /* ---------- Scene 2 (2.4-5.6s): terms line + empty rail draws ---------- */
        var TERM_AT = [2.95, 3.5, 4.05];
        all(".f11-pilot-term").forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            TERM_AT[i],
          );
        });

        // svg-path-draw: measured length, each segment starts at ~75% of the last.
        var SEG_DUR = 0.5;
        var SEG_AT = 3.9;
        all(".f11-pilot-seg").forEach(function (p, i) {
          var len = 0;
          try {
            len = p.getTotalLength();
          } catch (e) {
            len = 0;
          }
          if (!len) len = 836;
          len = Math.ceil(len * 1.02);
          p.style.strokeDasharray = len;
          tl.fromTo(
            p,
            { strokeDashoffset: len },
            { strokeDashoffset: 0, duration: SEG_DUR, ease: "power2.out" },
            SEG_AT + i * SEG_DUR * 0.75,
          );
        });

        /* ---------- Scene 3 (5.6-11.1s): one segment + one card per spoken step ---------- */
        // cues sit on the narration: baseline / shadow mode / measured recommendations / review
        var STEP_AT = [6.38, 7.34, 8.64, 10.34];
        var fills = all(".f11-pilot-fill");
        var cards = all(".f11-pilot-card");
        STEP_AT.forEach(function (at, i) {
          tl.fromTo(
            fills[i],
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power2.out" },
            at,
          );
          tl.fromTo(
            cards[i],
            { scale: 0, opacity: 0, y: 14 },
            { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            at + 0.06,
          );
        });

        // hold still on the full rail to the end of the frame
        tl.to({}, { duration: 0.01 }, 11.105);

        window.__timelines["11-pilot"] = tl;
