    [id="04-reroute-plate"] {

  <div

    <div

    ></div>

    <div id="04-reroute-plate">
      <div id="04-reroute-cam-outer">
        <div id="04-reroute-cam-inner" data-layout-allow-overflow>
          <img

    <div id="04-reroute-col">
      <div id="04-reroute-s1" class="04-reroute-step">
        <div class="04-reroute-num">01</div>

      <div id="04-reroute-s2" class="04-reroute-step">
        <div class="04-reroute-num">02</div>
        <div class="04-reroute-label">Route: Aisle A</div>
      </div>
      <div id="04-reroute-s3" class="04-reroute-step">
        <div class="04-reroute-num">03</div>
        <div class="04-reroute-label">Three observations</div>
        <div id="04-reroute-ticks">
          <div class="04-reroute-tick"><div class="04-reroute-tick-fill"></div></div>
          <div class="04-reroute-tick"><div class="04-reroute-tick-fill"></div></div>
          <div class="04-reroute-tick"><div class="04-reroute-tick-fill"></div></div>
        </div>
      </div>
      <div id="04-reroute-blocked">blocked</div>
      <div id="04-reroute-s4" class="04-reroute-step">
        <div class="04-reroute-num">04</div>
        <div class="04-reroute-label">Route: Aisle B</div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "04-reroute";
      var DUR = 11.072;
      var scope = document.querySelector('[data-composition-id="' + ID + '"]') || document;
      var q = function (name) {
        return scope.querySelector('[id="' + ID + "-" + name + '"]');
      };

      var plate = q("plate");
      var camOuter = q("cam-outer");
      var camInner = q("cam-inner");
      var before = q("before");
      var after = q("after");
      var s1 = q("s1");
      var s2 = q("s2");
      var s3 = q("s3");
      var s4 = q("s4");
      var blocked = q("blocked");
      var fills = scope.querySelectorAll('[class~="' + ID + '-tick-fill"]');

      var tl = gsap.timeline({ paused: true });

      /* ── Camera (coordinate-target-zoom inside a multi-phase camera) ──
         Nested wrappers: outer scales about 50% 50%, inner counter-translates.
         Target = Aisle A zone, centre (870, 385) in the 1920x1080 screenshot.
         The plate shows the screenshot at k = 1400 / 1920, so the target's
         offset from plate centre is ((870-960)k, (385-540)k) and T = -offset. */
      var K = 1400 / 1920;
      var TX = -(870 - 960) * K; //  +65.6
      var TY = -(385 - 540) * K; // +113.0
      var Z = 2.0;

      var eDrift = gsap.parseEase("sine.inOut");
      var eIn = gsap.parseEase("power3.inOut");
      var eOut = gsap.parseEase("power2.inOut");

      var PUSH_END = 2.5; // Scene 1: slow centred push 1.00 -> 1.03
      var ZOOM_DUR = 1.6; // Scene 2: zoom onto Aisle A, lands 4.1
      var HOLD_END = 7.5; // Scene 3: dwell on the aisle (slow creep + drift)
      var OUT_DUR = 2.0; // Scene 4: ease back out, locks at 9.5

      // One writer, closed-form in t: deterministic under any seek order.
      function writeCamera(t) {
        var s, f, p;
        if (t < PUSH_END) {
          s = 1 + 0.03 * eDrift(t / PUSH_END);
          f = 0;
        } else if (t < PUSH_END + ZOOM_DUR) {
          p = eIn((t - PUSH_END) / ZOOM_DUR);
          s = 1.03 + (Z - 1.03) * p;
          f = p;
        } else if (t < HOLD_END) {
          s = Z + 0.06 * ((t - PUSH_END - ZOOM_DUR) / (HOLD_END - PUSH_END - ZOOM_DUR));
          f = 1;
        } else if (t < HOLD_END + OUT_DUR) {
          p = eOut((t - HOLD_END) / OUT_DUR);
          s = Z + 0.06 + (1 - (Z + 0.06)) * p;
          f = 1 - p;
        } else {
          s = 1;
          f = 0;
        }
        // micro-drift, weighted by zoom so the wide framings stay edge-safe and the end locks still
        var w = Math.max(0, Math.min(1, s - 1));
        var ph = (t / DUR) * Math.PI * 2 * 2;
        var dx = Math.sin(ph) * 3 * w;
        var dy = Math.sin(ph * 1.3) * 1.5 * w;
        camOuter.style.transform = "scale(" + s.toFixed(5) + ")";
        camInner.style.transform =
          "translate(" + (f * TX + dx).toFixed(3) + "px, " + (f * TY + dy).toFixed(3) + "px)";
      }

      var cam = { t: 0 };
      tl.to(
        cam,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            writeCamera(cam.t);
          },
        },
        0,
      );
      writeCamera(0);

      /* ── Scene 1 (0.0–2.5): the before plate establishes; 01 START ── */
      tl.fromTo(
        plate,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0,
      );
      tl.fromTo(
        s1,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.6,
      );

      /* ── Scene 2 (2.5–4.3): camera commits to Aisle A; 02 ROUTE: AISLE A ── */
      tl.to(s1, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 2.7);
      tl.fromTo(
        s2,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        2.7,
      );

      /* ── Scene 3 (4.3–7.4): cut-the-curve swap to the after state, at matched framing ──
         Leftward, mirrored power4 in/out, same distance; 110 local px = 220 px on screen at 2x.
         The lone outgoing plate finishes fading 0.02s before the cut. */
      var CUT = 4.9;
      var TRAVEL = 110;
      tl.to(before, { x: -TRAVEL, duration: 0.3, ease: "power4.in" }, CUT - 0.3);
      tl.to(before, { opacity: 0, duration: 0.28, ease: "power1.in" }, CUT - 0.3);
      tl.fromTo(
        after,
        { x: TRAVEL, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.36, ease: "power4.out" },
        CUT,
      );

      // 03 THREE OBSERVATIONS + three ticks filling one by one (scaleX from the left)
      tl.to(s2, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 5.25);
      tl.fromTo(
        s3,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        5.25,
      );
      var TICK_AT = [5.7, 6.1, 6.5];
      for (var i = 0; i < fills.length; i++) {
        tl.fromTo(
          fills[i],
          { scaleX: 0 },
          { scaleX: 1, duration: 0.28, ease: "power2.out" },
          TICK_AT[i],
        );
      }

      // "blocked" lands
      tl.fromTo(
        blocked,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" },
        6.95,
      );

      /* ── Scene 4 (7.4–11.1): camera eases back out to the whole plate; 04 ROUTE: AISLE B ── */
      tl.to([s3, blocked], { opacity: 0.55, duration: 0.5, ease: "power2.out" }, 8.3);
      tl.fromTo(
        s4,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        8.3,
      );
      // locks and holds still from 9.5s to the end — no exit.

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
