    [class~="02-promise-stage"] {

  <div id="root" data-composition-id="02-promise" data-width="1920" data-height="1080" data-duration="5.101">
    <!-- track 0: dark ground -->
    <div
      class="clip 02-promise-ground"
      data-start="0"

    ></div>

    <!-- track 1: verb beats (dark register) -->
    <div
      class="clip 02-promise-band"
      data-start="0"

    >
      <div class="02-promise-stage" id="02-promise-stage">
        <div class="02-promise-lines">
          <div class="02-promise-line" id="02-promise-l1">sees it.</div>

    <div

      data-start="0"
      data-duration="5.101"
      data-track-index="3"
    >
      <div class="02-promise-mark" id="02-promise-mark">flowtwin</div>
      <div class="02-promise-stub" id="02-promise-stub"></div>
      <div class="02-promise-mono" id="02-promise-mono">SEE IT / REPLAN IT / PROVE IT</div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-promise";
      var DUR = 4.501;
      // One beat array drives every phase (voiceover cues).
      var BEATS = [0.1, 1.0, 2.3, 3.3];
      var T_ACCENT = 2.9; // "evidence" takes the accent as the voice reaches it

      var $ = function (s) {
        return document.getElementById(ID + "-" + s);
      };
      var lines = [$("l1"), $("l2"), $("l3")];
      var ticks = [$("t1"), $("t2"), $("t3")];
      var accent = $("accent");
      var stage = $("stage");

      // discrete-text-sequence: sparse states, reverse-searched every frame.
      var SEQUENCE = [
        { t: 0.0, line: 0, accent: false },
        { t: BEATS[1], line: 1, accent: false },
        { t: BEATS[2], line: 2, accent: false },
        { t: T_ACCENT, line: 2, accent: true },
      ];
      function stateAt(time) {
        for (var i = SEQUENCE.length - 1; i >= 0; i--) {
          if (time >= SEQUENCE[i].t) return SEQUENCE[i];
        }
        return SEQUENCE[0];
      }
      function render(time) {
        var s = stateAt(time);
        for (var i = 0; i < lines.length; i++) {
          lines[i].style.visibility = i === s.line ? "visible" : "hidden";
          ticks[i].style.background = i <= s.line ? "#BFD732" : "#2C2C2C";
        }
        accent.style.color = s.accent ? "#BFD732" : "#FFFFFF";
      }

      var tl = gsap.timeline({ paused: true });

      var driver = { t: 0 };
      tl.to(
        driver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            render(driver.t);
          },
        },
        0,
      );
      render(0);

      // Scene 1 — "sees it." slams in (kinetic-beat-slam: scale + blur hit).
      tl.fromTo(
        lines[0],
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.42, ease: "power4.out" },
        BEATS[0],
      );

      // Scene 2 — instant hard cut to "replans the delivery."; side-snap settle.
      tl.fromTo(
        stage,
        { x: -44 },
        { x: 0, duration: 0.32, ease: "expo.out", immediateRender: false },
        BEATS[1],
      );

      // Scene 3 — instant hard cut to "shows the evidence."; rise settle.
      tl.fromTo(
        stage,
        { y: 34 },
        { y: 0, duration: 0.36, ease: "circ.out", immediateRender: false },
        BEATS[2],
      );

      // Scene 4 — scale-swap handoff: line shrinks away, register flips to lime,
      // wordmark arrives at the same centre, then holds still.
      tl.to(stage, { scale: 0.55, opacity: 0, duration: 0.2, ease: "power3.in" }, BEATS[3]);
      tl.fromTo(
        $("lime"),
        { scaleY: 0 },
        { scaleY: 1, duration: 0.24, ease: "expo.out" },
        BEATS[3] + 0.1,
      );
      tl.fromTo(
        $("mark"),
        { scale: 1.4, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.4, ease: "expo.out" },
        BEATS[3] + 0.2,
      );
      tl.fromTo(
        $("stub"),
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: 0.2, ease: "power2.out" },
        BEATS[3] + 0.48,
      );
      tl.fromTo(
        $("mono"),
        { y: 14, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.28, ease: "power3.out" },
        BEATS[3] + 0.54,
      );

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
