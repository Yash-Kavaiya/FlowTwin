    <script>
      (function () {
        var FRAME_ID = "03-live-twin";
        var DURATION = 7.019;

        var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]') || document;
        function q(id) {
          return root.querySelector("#" + id);
        }

        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;

        /* ---------- camera: one world, one writer, outward only ---------- */
        var world = q("lt03-world");
        var S0 = 2.4; // tight open: racking rows fill the viewport
        var S_DWELL = 2.28; // gentle pre-reveal pull (< 15% of travel)
        var FOCUS_X = 948; // racking centre in world px (src 720, 470)
        var FOCUS_Y = 441;
        var VIEW_CX = 960;
        var VIEW_CY = 448;
        var TX0 = VIEW_CX - S0 * FOCUS_X;
        var TY0 = VIEW_CY - S0 * FOCUS_Y;

        var cam = { s: S0 };
        function writeCam() {
          var u = (cam.s - 1) / (S0 - 1);
          world.style.transform =
            "translate(" + TX0 * u + "px," + TY0 * u + "px) scale(" + cam.s + ")";
        }
        writeCam();

        var REVEAL_AT = 1.8;
        var REVEAL_DUR = 2.0; // decelerates to a full stop at 3.8s, then LOCKED

        // Scene 1 — tight on the racking, barely breathing outward
        tl.fromTo(
          cam,
          { s: S0 },
          { s: S_DWELL, duration: REVEAL_AT, ease: "none", onUpdate: writeCam },
          0,
        );
        // Scene 2 — the single decelerating zoom-out
        tl.fromTo(
          cam,
          { s: S_DWELL },
          {
            s: 1,
            duration: REVEAL_DUR,
            ease: "expo.out",
            immediateRender: false,
            onUpdate: writeCam,
          },
          REVEAL_AT,
        );

        // kicker
        tl.fromTo(
          q("lt03-kicker"),
          { opacity: 0, x: -12 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
          0.2,
        );

        /* ---------- svg draw setup (measured lengths) ---------- */
        function prepDraw(el, fallback) {
          var len = fallback;
          try {
            var m = el.getTotalLength();
            if (m && isFinite(m)) len = m;
          } catch (e) {}
          len = Math.ceil(len * 1.02);
          el.style.strokeDasharray = String(len);
          el.style.strokeDashoffset = String(len);
          return len;
        }

        /* ---------- Scene 2 callouts: starts computed from content, once ---------- */
        var CALLOUTS = [
          { key: "racking", text: "RACKING", fallback: 529, hold: 0 },
          { key: "docks", text: "DOCKS", fallback: 304, hold: 0 },
          { key: "conveyor", text: "CONVEYOR", fallback: 495, hold: 0 },
        ];
        var CALLOUT_START = 2.45;
        var BASE_DURATION = 0.5;
        var SEC_PER_CHAR = 0.02;
        var LEADER_DUR = 0.4;

        var cumulative = CALLOUT_START;
        var SEQUENCE = CALLOUTS.map(function (entry) {
          var dur = BASE_DURATION + entry.text.length * SEC_PER_CHAR + entry.hold;
          var start = cumulative;
          cumulative += dur;
          return { key: entry.key, fallback: entry.fallback, start: start, end: cumulative };
        });

        SEQUENCE.forEach(function (item) {
          var leader = q("lt03-leader-" + item.key);
          var dot = q("lt03-dot-" + item.key);
          var label = q("lt03-label-" + item.key);
          prepDraw(leader, item.fallback);

          tl.fromTo(
            dot,
            { opacity: 0 },
            { opacity: 1, duration: 0.15, ease: "power1.out" },
            item.start,
          );
          tl.to(
            leader,
            { strokeDashoffset: 0, duration: LEADER_DUR, ease: "power2.out" },
            item.start + 0.05,
          );
          tl.fromTo(
            label,
            { opacity: 0 },
            { opacity: 1, duration: 0.3, ease: "power1.out" },
            item.start + 0.05 + LEADER_DUR * 0.75,
          );
        });

        /* ---------- Scene 3: frame locked, lime outline draws around Aisle A ---------- */
        var ZONE_AT = 4.7;
        var ZONE_DUR = 0.8;
        var zone = q("lt03-zone");
        prepDraw(zone, 1004);

        tl.to(zone, { strokeDashoffset: 0, duration: ZONE_DUR, ease: "power2.out" }, ZONE_AT);
        tl.fromTo(
          q("lt03-zone-fill"),
          { opacity: 0 },
          { opacity: 0.12, duration: 0.5, ease: "power1.out" },
          ZONE_AT + ZONE_DUR,
        );
        tl.fromTo(
          q("lt03-zone-tag"),
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
          ZONE_AT + ZONE_DUR * 0.75,
        );

        // hold still to the end of the shot — no exit
        tl.set({}, {}, DURATION);
      })();
