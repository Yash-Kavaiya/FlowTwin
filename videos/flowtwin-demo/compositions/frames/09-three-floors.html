        var tl = gsap.timeline({ paused: true });

        var root = document.querySelector('[data-composition-id="09-three-floors"]');

        /* ── Scene 1 (0.0–1.7s): headline per-word, start times computed from

        var cumulative = HEAD_AT;
        var WORD_TIMELINE = words.map(function (el) {
          var start = cumulative;
          cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
          return { el: el, start: start };
        });
        WORD_TIMELINE.forEach(function (entry) {
          tl.fromTo(
