    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var FRAME_ID = "07-stack";
        var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
        var q = function (name) {
          return root.querySelector('[class~="' + FRAME_ID + "-" + name + '"]');
        };
        var qa = function (name) {
          return Array.prototype.slice.call(
            root.querySelectorAll('[class~="' + FRAME_ID + "-" + name + '"]'),
          );
        };

        var tl = gsap.timeline({ paused: true });

        /* ---------- Scene 1 (0.0–2.6s): empty outline, headline, Jetson fills ---------- */

        // empty stack outline — established immediately
        qa("slot").forEach(function (el, i) {
          tl.fromTo(
            el,
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power2.out" },
            0.05 + i * 0.05,
          );
        });

        // kicker
        tl.fromTo(
          q("rule"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.4, ease: "power3.out" },
          0.1,
        );
        tl.fromTo(
          q("kicker-text"),
          { opacity: 0, x: -12 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          0.16,
        );

        // headline lines — dynamic-content-sequencing: starts pre-computed once
        // from content length, not hardcoded per line.
        var HEADLINE_AT = 0.22;
        var BASE_DURATION = 0.62;
        var SEC_PER_CHAR = 0.045;
        var cumulative = HEADLINE_AT;
        var HEADLINE = qa("hl-line").map(function (el) {
          var start = cumulative;
          cumulative += BASE_DURATION + el.textContent.length * SEC_PER_CHAR;
          return { el: el, start: start, end: cumulative };
        });
        HEADLINE.forEach(function (entry) {
          tl.fromTo(
            entry.el,
            { yPercent: 108, opacity: 0 },
            { yPercent: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
            entry.start,
          );
        });

        // the accented layer fills in as the device is named
        var JETSON_AT = HEADLINE[1].start; // lands with the accent line
        tl.fromTo(
          q("jetson-fill"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.65, ease: "power3.out" },
          JETSON_AT,
        );
        tl.fromTo(
          q("jetson-label"),
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" },
          JETSON_AT + 0.25,
        );

        /* ---------- layers: spring-pop-entrance (smooth settle, no overshoot) ---------- */
        var POP_DUR = 0.6;
        var Y_RISE = 20;
        function pop(el, at) {
          tl.fromTo(
            el,
            { scale: 0, opacity: 0, y: Y_RISE },
            { scale: 1, opacity: 1, y: 0, duration: POP_DUR, ease: "power3.out" },
            at,
          );
        }

        // Scene 2 (2.6–4.7s): detector assembles above the device
        pop(q("layer-detector"), 2.85);

        // Scene 3 (4.7–6.8s): export layer + its mono tag
        pop(q("layer-trt"), 4.9);
        tl.fromTo(
          q("tag-line"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.35, ease: "power2.out" },
          5.3,
        );
        tl.fromTo(
          q("tag"),
          { opacity: 0, x: 14 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          5.5,
        );

        // Scene 4 (6.8–10.4s): top layer, bottom layer completes the stack, footnote
        pop(q("layer-panel"), 7.0);
        pop(q("layer-camera"), 8.0);
        tl.fromTo(
          q("footnote-rule"),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power3.out" },
          8.7,
        );
        tl.fromTo(
          q("footnote"),
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          8.85,
        );

        // hold still to the end of the frame's fixed duration (no exit)
        tl.set({}, {}, 10.368);

        window.__timelines = window.__timelines || {};
        window.__timelines[FRAME_ID] = tl;
      })();
