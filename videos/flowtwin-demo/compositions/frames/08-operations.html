<template>
  <div
    id="root"
    data-composition-id="08-operations"
    data-width="1920"
    data-height="1080"
    data-start="0"
    data-duration="9.823"
  >
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        font-style: normal;
        font-display: block;
        src: url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2");
      }

      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }

      /* full-bleed ground lives on a clip layer, never on #root */
      .f08-operations-ground {
        position: absolute;
        inset: 0;
        background: #0a0a0a;
        container-type: size;
      }

      .f08-operations-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      /* mono tag rail, top-left above the plate */
      .f08-operations-tags {
        position: absolute;
        left: 153px;
        top: 48px;
        width: 1200px;
        height: 32px;
      }
      .f08-operations-tag {
        position: absolute;
        left: 0;
        top: 0;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 400;
        font-size: 20px;
        line-height: 1;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #bfd732;
        will-change: transform, opacity;
      }
      .f08-operations-tag::before {
        content: "";
        display: block;
        width: 36px;
        height: 2px;
        background: #bfd732;
        flex: none;
      }

      /* the plate window: flat, 0 radius, 1px hairline. 1612x770 inner. */
      .f08-operations-window {
        position: absolute;
        left: 153px;
        top: 103px;
        width: 1614px;
        height: 772px;
        box-sizing: border-box;
        border: 1px solid #2c2c2c;
        background: #0a0a0a;
        overflow: hidden;
      }

      /* ONE camera wrapper. World space = screenshot pixel space (1920x1080). */
      .f08-operations-world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
        will-change: transform, filter;
      }
      .f08-operations-plate {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        display: block;
      }
      .f08-operations-mark {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        overflow: visible;
        pointer-events: none;
      }
      .f08-operations-mark rect {
        fill: none;
        stroke: #bfd732;
        stroke-width: 1.5;
        stroke-linecap: square;
        stroke-linejoin: miter;
      }
    </style>

    <div
      class="clip f08-operations-ground"
      data-start="0"
      data-duration="9.823"
      data-track-index="0"
    ></div>

    <div
      class="clip f08-operations-stage"
      data-start="0"
      data-duration="9.823"
      data-track-index="1"
    >
      <div class="f08-operations-tags">
        <div class="f08-operations-tag" id="f08-operations-tag-1">Fleet · Simulated</div>
        <div class="f08-operations-tag" id="f08-operations-tag-2">KPIs · From the session</div>
        <div class="f08-operations-tag" id="f08-operations-tag-3">Stock · Simulated</div>
      </div>

      <div class="f08-operations-window">
        <div class="f08-operations-world" id="f08-operations-world" data-layout-allow-overflow>
          <img
            class="f08-operations-plate"
            id="f08-operations-plate-a"
            src="assets/05-fleet-heatmap.png"
            alt=""
          />
          <img
            class="f08-operations-plate"
            id="f08-operations-plate-b"
            src="assets/06-inventory.png"
            alt=""
          />
          <!-- lime outline around one real table row of the inventory card
               (row y 377-400 in screenshot pixels, measured from the asset) -->
          <svg
            class="f08-operations-mark"
            viewBox="0 0 1920 1080"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect id="f08-operations-row" x="1185" y="377" width="327" height="23" />
          </svg>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var ID = "08-operations";
        var DUR = 9.323;
        var WW = 1612; // plate window inner width
        var WH = 770; // plate window inner height

        var world = document.getElementById("f08-operations-world");
        var row = document.getElementById("f08-operations-row");

        // Camera: single source of truth. (fx, fy) is the screenshot pixel that
        // sits at the window centre; s is the zoom. One writer composes it.
        var cam = { s: 0.8396, fx: 960, fy: 458.6, blur: 0 };
        function applyCamera() {
          var tx = WW / 2 - cam.fx * cam.s;
          var ty = WH / 2 - cam.fy * cam.s;
          world.style.transform =
            "translate(" + tx.toFixed(3) + "px, " + ty.toFixed(3) + "px) scale(" + cam.s.toFixed(5) + ")";
          world.style.filter = cam.blur > 0.05 ? "blur(" + cam.blur.toFixed(2) + "px)" : "none";
        }
        applyCamera();

        // Poses (screenshot pixel coordinates, baked from the assets).
        var WIDE = { s: 0.8396, fx: 960, fy: 458.6 }; // full plate width, top-aligned
        var WIDE_DRIFT = { s: 0.868, fx: 952, fy: 456 };
        var FLEET = { s: 1.5, fx: 830, fy: 440 }; // three vehicles in the aisles
        var FLEET_DRIFT = { s: 1.54, fx: 830, fy: 440 };
        var KPI = { s: 2.1, fx: 384, fy: 183.5 }; // KPI strip, top-left of the plate
        var KPI_DRIFT = { s: 2.16, fx: 373.2, fy: 178.3 };
        var CARD_ARRIVE = { s: 1.4, fx: 1349, fy: 291.5 }; // rack inventory card
        var CARD = { s: 1.75, fx: 1349, fy: 291.5 };

        function leg(from, to, dur, ease, at) {
          tl.fromTo(
            cam,
            { s: from.s, fx: from.fx, fy: from.fy },
            {
              s: to.s,
              fx: to.fx,
              fy: to.fy,
              duration: dur,
              ease: ease,
              immediateRender: false,
              onUpdate: applyCamera,
            },
            at,
          );
        }

        // svg-path-draw setup: measured perimeter, fully hidden at start.
        var rowLen = row.getTotalLength ? row.getTotalLength() : 2 * (327 + 23);
        if (!rowLen) rowLen = 2 * (327 + 23);
        row.style.strokeDasharray = rowLen + " " + rowLen;

        var tl = gsap.timeline({ paused: true });

        // ---------- Scene 1 (0.0-2.6s): wide plate, then dive onto the fleet ----------
        tl.fromTo(
          "#f08-operations-tag-1",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          0.3,
        );
        leg(WIDE, WIDE_DRIFT, 0.9, "none", 0);
        leg(WIDE_DRIFT, FLEET, 1.2, "power3.inOut", 0.9); // "a fleet that obeys the same zones"
        leg(FLEET, FLEET_DRIFT, 0.6, "none", 2.1);

        // ---------- Scene 2 (2.6-5.4s): travel up-left to the KPI strip, lock ----------
        leg(FLEET_DRIFT, KPI, 1.3, "power2.inOut", 2.7); // "live numbers, counted from the session"
        tl.to("#f08-operations-tag-1", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, 2.8);
        tl.fromTo(
          "#f08-operations-tag-2",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          3.0,
        );
        leg(KPI, KPI_DRIFT, 1.3, "none", 4.0);

        // ---------- Scene 3 (5.4-9.3s): cut-the-curve plate swap, push onto the card ----------
        // One power4.inOut travel; the plate swaps at its midpoint (peak velocity),
        // both plates share world space so the framing is matched across the cut.
        var CUT_START = 5.3;
        var CUT_DUR = 1.4;
        var CUT_AT = CUT_START + CUT_DUR / 2; // 6.0s
        leg(KPI_DRIFT, CARD_ARRIVE, CUT_DUR, "power4.inOut", CUT_START); // "stock on every rack"
        tl.fromTo(
          cam,
          { blur: 0 },
          { blur: 14, duration: CUT_DUR / 2, ease: "power4.in", immediateRender: false, onUpdate: applyCamera },
          CUT_START,
        );
        tl.fromTo(
          cam,
          { blur: 14 },
          { blur: 0, duration: CUT_DUR / 2, ease: "power4.out", immediateRender: false, onUpdate: applyCamera },
          CUT_AT,
        );
        tl.fromTo(
          "#f08-operations-plate-b",
          { opacity: 0 },
          { opacity: 1, duration: 0.04, ease: "none" },
          CUT_AT - 0.02,
        );
        tl.to("#f08-operations-tag-2", { opacity: 0, y: -12, duration: 0.2, ease: "power2.in" }, CUT_AT - 0.2);
        tl.fromTo(
          "#f08-operations-tag-3",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          CUT_AT,
        );

        // landing push onto the rack inventory card, then lock
        leg(CARD_ARRIVE, CARD, 0.9, "power2.inOut", CUT_START + CUT_DUR);

        // "down to the slot": lime outline draws around one table row
        tl.fromTo(
          row,
          { strokeDashoffset: rowLen },
          { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" },
          7.65,
        );

        // hold still to the end of the frame (no exit; the root transition is the exit)
        tl.to({}, { duration: 0.01 }, DUR - 0.01);

        window.__timelines = window.__timelines || {};
        window.__timelines[ID] = tl;
      })();
    </script>
  </div>
</template>
