  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "06-rules";
      var DURATION = 11.328;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var all = function (cls) {
        return Array.prototype.slice.call(
          root.querySelectorAll('[class~="' + FRAME_ID + "-" + cls + '"]'),
        );
      };

      var tl = gsap.timeline({ paused: true });

      // dynamic-content-sequencing: each word's slot is computed once from its
      // length (BASE + chars x SEC_PER_CHAR), then fitted to the spoken window.
      var BASE = 0.14;
      var SEC_PER_CHAR = 0.04;
      function sequence(els, startAt, span) {
        var weights = els.map(function (el) {
          return BASE + el.textContent.trim().length * SEC_PER_CHAR;
        });
        var total = weights.reduce(function (a, b) {
          return a + b;
        }, 0);
        var k = span ? span / total : 1;
        var cumulative = startAt;
        return els.map(function (el, i) {
          var start = cumulative;
          cumulative += weights[i] * k;
          return { el: el, start: start };
        });
      }

      // Macro camera: slow push-in under the whole build, resting before the
      // final hold so the triptych sits still.
      tl.fromTo(
        all("world")[0],
        { scale: 1 },
        { scale: 1.022, duration: 10.0, ease: "power1.out" },
        0,
      );

      // Scene 1 (0.0-2.3s): rule stub, then the headline per word.
      tl.fromTo(
        all("stub")[0],
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power3.out" },
        0.05,
      );
      sequence(all("hword"), 0.15, 0).forEach(function (w) {
        tl.fromTo(
          w.el,
          { opacity: 0, y: 28 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          w.start,
        );
      });

      // Scenes 2-4: one card per spoken rule, each into its own third.
      var CARD_CUES = [
        { at: 2.3, readSpan: 1.9 },
        { at: 4.9, readSpan: 2.1 },
        { at: 7.7, readSpan: 2.4 },
      ];
      var cards = all("card");
      cards.forEach(function (card, i) {
        var cue = CARD_CUES[i];
        var border = card.querySelector('[class~="' + FRAME_ID + '-border"]');
        var body = card.querySelector('[class~="' + FRAME_ID + '-body"]');
        var words = Array.prototype.slice.call(
          card.querySelectorAll('[class~="' + FRAME_ID + '-word"]'),
        );

        // Hairline draws across the slot.
        tl.fromTo(
          border,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power3.out" },
          cue.at,
        );

        // spring-pop-entrance: scale 0 -> 1 on a smooth power3 settle, no overshoot.
        tl.fromTo(
          body,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          cue.at + 0.08,
        );

        // The sentence lights word by word as the voice reaches it.
        sequence(words, cue.at + 0.3, cue.readSpan).forEach(function (w) {
          tl.fromTo(
            w.el,
            { opacity: 0.22 },
            { opacity: 1, duration: 0.3, ease: "power2.out" },
            w.start,
          );
        });
      });

      // Pad to the fixed frame duration; the triptych holds still to the end.
      tl.set({}, {}, DURATION);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
