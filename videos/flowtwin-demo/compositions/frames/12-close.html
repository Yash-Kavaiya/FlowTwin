  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "12-close";
      var DURATION = 8.213;
      var root = document.querySelector('[data-composition-id="' + FRAME_ID + '"]');
      var q = function (sel) {
        return root.querySelector(sel);
      };
      var qa = function (sel) {
        return Array.prototype.slice.call(root.querySelectorAll(sel));
      };

      var limits = q(".f12-close-limits");
      var kicker = q(".f12-close-kicker");
      var lines = qa(".f12-close-line");
      var lime = q(".f12-close-ground-lime");
      var end = q(".f12-close-end");
      var verbs = qa(".f12-close-verb");

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0–3.4s): limit lines land on their spoken cues ---- */
      var LIMIT_CUES = [0.25, 1.15, 2.05];
      tl.fromTo(
        kicker,
        { opacity: 0, x: -24 },
        { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" },
        0.1
      );
      lines.forEach(function (line, i) {
        tl.fromTo(
          line,
          { opacity: 0, x: -70 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
          LIMIT_CUES[i]
        );
      });

      /* ---- Scene 2 (3.4–4.8s): scale-swap handoff, register flips to lime ---- */
      var TRIGGER = 3.4;
      var EXIT_DUR = 0.35;
      var ENTER_DUR = 0.6;
      var OVERLAP = 0.15;
      var EXIT_SCALE = 0.7;

      tl.to(
        limits,
        { scale: EXIT_SCALE, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
        TRIGGER
      );
      tl.fromTo(
        lime,
        { opacity: 0 },
        { opacity: 1, duration: 0.22, ease: "power2.inOut" },
        TRIGGER + 0.08
      );
      tl.fromTo(
        end,
        { scale: EXIT_SCALE, opacity: 0 },
        { scale: 1, opacity: 1, duration: ENTER_DUR, ease: "back.out(1.4)" },
        TRIGGER + EXIT_DUR - OVERLAP
      );

      /* ---- Scene 3 (4.8–8.2s): three verbs slam in, one per beat ---- */
      var PULSE = 0.5;
      var FIRST = 4.9;
      var BEATS = [FIRST, FIRST + PULSE * 2, FIRST + PULSE * 4];

      tl.fromTo(
        verbs[0],
        { scale: 1.5, filter: "blur(16px)", opacity: 0 },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
        BEATS[0]
      );
      tl.fromTo(
        verbs[1],
        { x: -180, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" },
        BEATS[1]
      );
      tl.fromTo(
        verbs[2],
        { y: 90, rotation: 6, opacity: 0 },
        { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "circ.out" },
        BEATS[2]
      );

      /* ---- Final frame only: hold still, then a short fade over the last 0.5s ---- */
      tl.to([end, lime], { opacity: 0, duration: 0.5, ease: "power1.in" }, DURATION - 0.5);

      window.__timelines = window.__timelines || {};
      window.__timelines[FRAME_ID] = tl;
    })();
